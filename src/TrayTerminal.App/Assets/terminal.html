<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' file: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <script src="./xterm/xterm.js"></script>
  <script src="./xterm/addon-serialize.js"></script>
  <title>TrayTerminal</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050607;
    }

    body {
      color: #d7dde2;
      font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
      font-size: 13px;
    }

    #terminal {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: transparent;
    }

    #terminal,
    #fallback {
      background-position: left top;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .xterm,
    .xterm-screen,
    .xterm-viewport {
      background: transparent !important;
    }

    #fallback {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      outline: none;
      caret-color: #20b486;
      line-height: 18px;
      background-color: transparent;
      color: #d7dde2;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <pre id="fallback" tabindex="0" hidden></pre>

  <script>
    (() => {
      const encoder = new TextEncoder();
      const terminalHost = document.getElementById('terminal');
      const fallback = document.getElementById('fallback');
      const maxSnapshotBytes = 8 * 1024 * 1024;
      const checkpointIntervalMs = 2000;
      let terminal = null;
      let serializeAddon = null;
      let fontSize = 16;
      let lastCols = 120;
      let lastRows = 30;
      let queuedSequence = 0;
      let parsedSequence = 0;
      let lastSnapshotSequence = -1;
      let lastSnapshotAt = 0;
      let snapshotInProgress = false;
      let checkpointTimer = null;
      let checkpointForced = false;

      function post(message) {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      function sendInput(text) {
        post({ type: 'input', data: text });
      }

      function base64ToBytes(payload) {
        const binary = atob(payload);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function bytesToBase64(bytes) {
        const chunkSize = 0x8000;
        let binary = '';
        for (let offset = 0; offset < bytes.length; offset += chunkSize) {
          const chunk = bytes.subarray(offset, Math.min(offset + chunkSize, bytes.length));
          binary += String.fromCharCode.apply(null, chunk);
        }
        return btoa(binary);
      }

      function createBoundedSnapshot() {
        if (!serializeAddon) return null;

        // The terminal itself keeps 5000 scrollback lines for the local user,
        // but checkpoints intentionally serialize a bounded suffix. Reducing the
        // suffix protects the permanent background service from pathological
        // per-cell style sequences producing oversized snapshots.
        let scrollback = 256;
        while (scrollback >= 0) {
          const serialized = serializeAddon.serialize({ scrollback });
          const bytes = encoder.encode(serialized);
          if (bytes.length <= maxSnapshotBytes) {
            return bytes;
          }
          if (scrollback === 0) break;
          scrollback = Math.floor(scrollback / 2);
        }
        return null;
      }

      function maybeCheckpoint(force) {
        if (!terminal || !serializeAddon || snapshotInProgress ||
            parsedSequence !== queuedSequence) {
          return;
        }

        const now = Date.now();
        if (!force &&
            parsedSequence === lastSnapshotSequence) {
          return;
        }
        const elapsed = now - lastSnapshotAt;
        if (lastSnapshotAt > 0 && elapsed < checkpointIntervalMs) {
          checkpointForced = checkpointForced || force;
          if (checkpointTimer === null) {
            checkpointTimer = window.setTimeout(() => {
              checkpointTimer = null;
              const scheduledForce = checkpointForced;
              checkpointForced = false;
              maybeCheckpoint(scheduledForce);
            }, checkpointIntervalMs - elapsed);
          }
          return;
        }

        snapshotInProgress = true;
        try {
          if (checkpointTimer !== null) {
            window.clearTimeout(checkpointTimer);
            checkpointTimer = null;
          }
          checkpointForced = false;
          const bytes = createBoundedSnapshot();
          if (!bytes) {
            lastSnapshotAt = now;
            post({ type: 'snapshotUnavailable', sequence: parsedSequence });
            return;
          }

          post({
            type: 'snapshot',
            sequence: parsedSequence,
            cols: terminal.cols,
            rows: terminal.rows,
            data: bytesToBase64(bytes)
          });
          lastSnapshotSequence = parsedSequence;
          lastSnapshotAt = now;
        } finally {
          snapshotInProgress = false;
        }
      }

      function requestPaste() {
        post({ type: 'paste' });
      }

      function requestCopy(text) {
        if (text) {
          post({ type: 'copy', data: text });
        }
      }

      function isClipboardShortcut(event, key) {
        return event.ctrlKey &&
          !event.altKey &&
          !event.metaKey &&
          typeof event.key === 'string' &&
          event.key.toLowerCase() === key;
      }

      function selectedTextFor(target) {
        if (terminal && typeof terminal.hasSelection === 'function' && terminal.hasSelection()) {
          return typeof terminal.getSelection === 'function' ? terminal.getSelection() : '';
        }

        if (target && typeof target.selectionStart === 'number' && typeof target.selectionEnd === 'number') {
          return target.value.substring(target.selectionStart, target.selectionEnd);
        }

        const selection = window.getSelection();
        return selection && !selection.isCollapsed ? selection.toString() : '';
      }

      function stopShortcut(event) {
        event.preventDefault();
        event.stopPropagation();
      }

      function handleClipboardShortcut(event, target) {
        if (isClipboardShortcut(event, 'v')) {
          stopShortcut(event);
          requestPaste();
          return true;
        }

        if (isClipboardShortcut(event, 'c')) {
          const selectedText = selectedTextFor(target);
          if (selectedText) {
            stopShortcut(event);
            requestCopy(selectedText);
            return true;
          }
        }

        return false;
      }

      function handleTerminalKeyEvent(event) {
        if (event.type !== 'keydown') {
          return true;
        }

        return !handleClipboardShortcut(event, terminal);
      }

      function estimateSize(force) {
        let cols, rows;
        if (terminal && terminal._core && terminal._core._renderService) {
          try {
            const dims = terminal._core._renderService.dimensions;
            if (dims && dims.css && dims.css.cell.width > 0 && dims.css.cell.height > 0) {
              const cellWidth = dims.css.cell.width;
              const cellHeight = dims.css.cell.height;
              const width = terminalHost.clientWidth || document.body.clientWidth || 900;
              const height = terminalHost.clientHeight || document.body.clientHeight || 500;
              cols = Math.max(20, Math.floor(width / cellWidth));
              rows = Math.max(5, Math.floor(height / cellHeight));
            }
          } catch (e) {}
        }
        if (!cols || !rows) {
          const width = document.body.clientWidth || 900;
          const height = document.body.clientHeight || 500;
          cols = Math.max(20, Math.floor(width / Math.max(7, fontSize * 0.6)));
          rows = Math.max(5, Math.floor(height / Math.max(14, fontSize * 1.2)));
        }
        if (force || cols !== lastCols || rows !== lastRows) {
          lastCols = cols;
          lastRows = rows;
          post({ type: 'resize', cols, rows });
        }
      }

      function stripAnsi(text) {
        return text
          .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '')
          .replace(/\x1b\][^\x07]*(\x07|\x1b\\)/g, '')
          .replace(/\x1b[>=c78]/g, '');
      }

      function writeFallback(text) {
        const clean = stripAnsi(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        fallback.textContent += clean;
        if (fallback.textContent.length > 800000) {
          fallback.textContent = fallback.textContent.slice(-600000);
        }
        fallback.scrollTop = fallback.scrollHeight;
      }

      function mapKey(event) {
        if (event.ctrlKey && !event.altKey && event.key.length === 1) {
          const code = event.key.toUpperCase().charCodeAt(0);
          if (code >= 65 && code <= 90) {
            return String.fromCharCode(code - 64);
          }
        }

        switch (event.key) {
          case 'Enter': return '\r';
          case 'Backspace': return '\x7f';
          case 'Tab': return '\t';
          case 'Escape': return '\x1b';
          case 'ArrowUp': return '\x1b[A';
          case 'ArrowDown': return '\x1b[B';
          case 'ArrowRight': return '\x1b[C';
          case 'ArrowLeft': return '\x1b[D';
          case 'Home': return '\x1b[H';
          case 'End': return '\x1b[F';
          case 'Insert': return '\x1b[2~';
          case 'Delete': return '\x1b[3~';
          case 'PageUp': return '\x1b[5~';
          case 'PageDown': return '\x1b[6~';
          default:
            return event.key.length === 1 && !event.ctrlKey && !event.metaKey ? event.key : null;
        }
      }

      function attachInput(target) {
        target.addEventListener('keydown', event => {
          if (handleClipboardShortcut(event, target)) {
            return;
          }

          const input = mapKey(event);
          if (input !== null) {
            event.preventDefault();
            sendInput(input);
          }
        });

        target.addEventListener('paste', event => {
          const text = event.clipboardData.getData('text/plain');
          if (text) {
            event.preventDefault();
            sendInput(text);
          }
        });
      }

      function initTerminal() {
        if (window.Terminal) {
          terminal = new window.Terminal({
            cursorBlink: true,
            convertEol: true,
            scrollback: 5000,
            fontFamily: 'Consolas, "Cascadia Mono", "Courier New", monospace',
            fontSize,
            lineHeight: 1.2,
            cursorStyle: 'block',
            allowTransparency: true,
            theme: {
              background: 'rgba(0, 0, 0, 0)',
              foreground: '#d7dde2',
              cursor: '#20b486',
              selectionBackground: '#264f78'
            }
          });
          if (window.SerializeAddon && window.SerializeAddon.SerializeAddon) {
            serializeAddon = new window.SerializeAddon.SerializeAddon();
            terminal.loadAddon(serializeAddon);
          }
          terminal.open(terminalHost);
          terminal.focus();
          terminal.attachCustomKeyEventHandler(handleTerminalKeyEvent);
          terminal.onData(sendInput);
        } else {
          terminalHost.hidden = true;
          fallback.hidden = false;
          fallback.focus();
          attachInput(fallback);
          writeFallback('xterm.js 静态文件未找到，已启用轻量渲染模式\n');
        }

        estimateSize();
        post({ type: 'ready' });
      }

      window.trayTerminal = {
        writeSequencedBatch(outputs) {
          if (!terminal || !Array.isArray(outputs)) return false;
          for (const output of outputs) {
            if (!output || !Number.isSafeInteger(output.sequence) ||
                typeof output.data !== 'string') {
              return false;
            }
            if (output.sequence <= queuedSequence) {
              continue;
            }
            if (output.sequence !== queuedSequence + 1) {
              post({
                type: 'stateGap',
                expected: queuedSequence + 1,
                actual: output.sequence
              });
              return false;
            }

            const bytes = base64ToBytes(output.data);
            const sequence = output.sequence;
            queuedSequence = sequence;
            terminal.write(bytes, () => {
              parsedSequence = sequence;
              maybeCheckpoint(false);
            });
          }
          return true;
        },
        restoreState(snapshotSequence, snapshotPayload, latestSequence,
                     replayPayload, columns, rows, restoreId) {
          if (!terminal || !serializeAddon ||
              !Number.isSafeInteger(snapshotSequence) ||
              !Number.isSafeInteger(latestSequence) ||
              latestSequence < snapshotSequence) {
            return false;
          }

          const snapshotBytes = base64ToBytes(snapshotPayload);
          const replayBytes = base64ToBytes(replayPayload);
          terminal.reset();
          terminal.resize(
            Math.max(20, Math.min(500, Number(columns) || 120)),
            Math.max(5, Math.min(200, Number(rows) || 30)));
          queuedSequence = latestSequence;
          parsedSequence = snapshotSequence;
          lastSnapshotSequence = -1;

          terminal.write(snapshotBytes, () => {
            parsedSequence = snapshotSequence;
            if (replayBytes.length > 0) {
              terminal.write(replayBytes, () => {
                parsedSequence = latestSequence;
                maybeCheckpoint(true);
                post({ type: 'stateRestored', restoreId });
              });
            } else {
              parsedSequence = latestSequence;
              maybeCheckpoint(true);
              post({ type: 'stateRestored', restoreId });
            }
          });
          return true;
        },
        resizeAuthoritative(columns, rows) {
          lastCols = Math.max(20, Math.min(500, Number(columns) || 120));
          lastRows = Math.max(5, Math.min(200, Number(rows) || 30));
          if (terminal) {
            terminal.resize(lastCols, lastRows);
            maybeCheckpoint(true);
          }
        },
        requestSizeEstimate() {
          window.requestAnimationFrame(() => estimateSize(true));
        },
        pasteText(text) {
          if (!text) {
            return;
          }

          if (terminal && typeof terminal.paste === 'function') {
            terminal.paste(text);
          } else {
            sendInput(text);
          }
        },
        setFontSize(value) {
          fontSize = Math.max(10, Math.min(32, Number(value) || 16));
          document.body.style.fontSize = `${fontSize}px`;
          fallback.style.fontSize = `${fontSize}px`;
          fallback.style.lineHeight = `${Math.round(fontSize * 1.35)}px`;
          if (terminal) {
            terminal.options.fontSize = fontSize;
            terminal.options.lineHeight = 1.2;
          }
          window.requestAnimationFrame(estimateSize);
        },
        setBackground(uri, cover) {
          const normalizedCover = Math.max(0, Math.min(100, Number(cover) || 0));
          const opacity = normalizedCover * 0.0096;
          const backgroundImage = uri
            ? `linear-gradient(rgba(0, 0, 0, ${opacity}), rgba(0, 0, 0, ${opacity})), url("${uri}")`
            : 'none';

          terminalHost.style.backgroundImage = backgroundImage;
          fallback.style.backgroundImage = backgroundImage;
        }
      };

      window.addEventListener('resize', () => window.requestAnimationFrame(estimateSize));
      document.addEventListener('DOMContentLoaded', initTerminal);
    })();
  </script>
</body>
</html>
